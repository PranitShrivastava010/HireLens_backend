name: Fetch Jobs Cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger fetch cron endpoint
        env:
          CRON_BASE_URL: ${{ vars.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_BASE_URL" ]; then
            echo "CRON_BASE_URL repo variable is missing"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is missing"
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/fetch-jobs"
